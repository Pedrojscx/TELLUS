[project]
name = "tellus"
version = "0.1.0"
description = "TELLUS: apoio à decisão da segunda safra com dados NASA e fontes oficiais"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.2",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tellus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
